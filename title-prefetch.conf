# Example configuration for title-prefetch.
# Copy to ~/.config/mpv/script-opts/title-prefetch.conf
# Values shown are the defaults.

# Entries before and after the current one to resolve; -1 (any negative) resolves all, 0 disables
range=5

# Resolve http(s):// and ytdl:// entries via yt-dlp
resolve_remote=yes

# Resolve local files via a headless mpv probe
resolve_local=yes

# Maximum number of cached titles, FIFO; 0 disables the cache, negative is unlimited
cache_size=500

# Directory of the title cache, one file per entry; an empty value disables the cache
cache_dir=~~cache/title-prefetch

# Maximum number of simultaneous subprocesses; a yt-dlp batch counts as one
concurrency=5

# Seconds before a subprocess is aborted and counted as failed;
# a yt-dlp batch counts as one, and its entries resolved before the timeout keep their titles
timeout=30

# Executable used for the local probe
mpv_path=mpv

# yt-dlp --extractor-args for title lookups, as whitespace-separated IE_KEY:ARGS entries;
# `default` expands to a built-in set that skips YouTube requests a title does not need
# (see DEFAULT_EXTRACTOR_ARGS in lib/ytdl.lua of the script), empty = none
ytdl_extractor_args=default

# Remote URLs resolved by one yt-dlp process, which saves its startup time; 1 disables batching
ytdl_batch_size=5
